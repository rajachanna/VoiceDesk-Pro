[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voicedesk-pro"
version = "0.1.0"
description = "Secure Twilio voice receptionist prototype with local appointment booking and CRM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Raja Channa / NextGen Tech Solutions"}]
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "twilio>=9,<10",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ai = ["openai>=1.68,<3"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["voicedesk"]
[tool.setuptools.package-data]
voicedesk = ["static/*.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
